# defines the agent
name: react
states:
  question:
    text: "[Question]"
  thought:
    text: "[Thought]"
  action:
    text: "[Action]"
  action-input:
    text: "[Action Input]"
  observation:
    text: "[Observation]"
    env_input: true
  final-thought:
    text: "[Final Thought]"
  answer:
    text: "[Answer]"
behavior:
  - next:
      - question
      - until_5:
          - next:
              - thought
              - action
              - action-input
              - observation
          - final-thought
      - answer
